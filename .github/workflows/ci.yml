name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Normalize formatting on the stabilization branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/hk-0.1x-stabilization'
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet -- '*.rs'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.rs'
            git commit -m "style: apply rustfmt to HK workspace"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
