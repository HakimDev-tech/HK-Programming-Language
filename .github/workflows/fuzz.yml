name: Fuzz

on:
  push:
    branches: [main, "test/**"]
    paths:
      - "compiler/crates/hk/src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  pull_request:
    paths:
      - "compiler/crates/hk/src/**"
      - "fuzz/**"
      - "Cargo.toml"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz target
        run: cargo fuzz build run
      - name: Fuzz HK source parser and interpreter
        run: cargo fuzz run run -- -max_total_time=45 -max_len=4096
      - name: Build v0.5 syntax fuzz target
        run: cargo fuzz build syntax_v05
      - name: Fuzz v0.5 lexer, type-expression and nominal parsers
        run: cargo fuzz run syntax_v05 -- -max_total_time=30 -max_len=4096
      - name: Build module resolver fuzz target
        run: cargo fuzz build modules
      - name: Fuzz module specifiers and filesystem resolution
        run: cargo fuzz run modules -- -max_total_time=30 -max_len=2048
      - name: Build bytecode verifier fuzz target
        run: cargo fuzz build bytecode_verifier
      - name: Fuzz malformed bytecode verification
        run: cargo fuzz run bytecode_verifier -- -max_total_time=30 -max_len=1024
