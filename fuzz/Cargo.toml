[package]
name = "hk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hk = { path = "../compiler/crates/hk", features = ["fuzzing"] }

[[bin]]
name = "run"
path = "fuzz_targets/run.rs"
test = false
doc = false
bench = false

[[bin]]
name = "modules"
path = "fuzz_targets/modules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bytecode_verifier"
path = "fuzz_targets/bytecode_verifier.rs"
test = false
doc = false
bench = false

[[bin]]
name = "syntax_v05"
path = "fuzz_targets/syntax_v05.rs"
test = false
doc = false
bench = false
